[mod-name]
WePlayPersonalUnicornLasers=WePlay: Personal Unicorn Lasers

[mod-description]
WePlayPersonalUnicornLasers=Personal laser defense fires rainbow beams, with the colors streaming toward the target. Works with modded personal laser defenses too. Laser turrets are left as they are.

[mod-setting-name]
wp-pul-scale=Rainbow scale
wp-pul-speed=Flow speed
wp-pul-saturation=Color saturation

[mod-setting-description]
wp-pul-scale=1 stretches one rainbow over 24 tiles, so a beam shows a few colors at a time. Each step makes the rainbow smaller, down to 5: a tight little rainbow every tile and a half.
wp-pul-speed=How fast the colors stream toward the target: 1x to 4x.
wp-pul-saturation=1 is full-strength rainbow; lower values give softer, pastel colors.
